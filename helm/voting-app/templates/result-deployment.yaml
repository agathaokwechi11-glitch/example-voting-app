apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result
          image: "{{ .Values.images.result.repository }}:{{ .Values.images.result.tag }}"
          imagePullPolicy: {{ .Values.images.result.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
