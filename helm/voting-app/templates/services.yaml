apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    app: vote
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.votePort }}
      targetPort: http
  selector:
    app: vote
---
apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    app: result
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.resultPort }}
      targetPort: http
  selector:
    app: result
