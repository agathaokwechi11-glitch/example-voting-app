apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: "{{ .Values.images.vote.repository }}:{{ .Values.images.vote.tag }}"
          imagePullPolicy: {{ .Values.images.vote.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: OPTION_A
              value: {{ .Values.voteOptions.optionA | quote }}
            - name: OPTION_B
              value: {{ .Values.voteOptions.optionB | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
